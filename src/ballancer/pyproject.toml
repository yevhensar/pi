[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fpv-ballancer"
version = "0.1.0"
description = "Safety-first Raspberry Pi companion stabilization prototype for Betaflight"
requires-python = ">=3.11"
dependencies = [
  "pyserial>=3.5,<4",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8,<9",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0,<7",
  "types-pyserial>=3.5,<4",
]

[project.scripts]
fpv-stabilizer = "fpv_stabilizer.app.main:main"
fpv-telemetry = "fpv_stabilizer.tools.telemetry:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fpv_stabilizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["fpv_stabilizer"]
